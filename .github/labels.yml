# Repository labels. Sync to GitHub with: scripts/github/sync-labels.sh
# Skills rely on these names (/triage, /breakdown) — rename carefully.
- name: "type:bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or improvement"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, dependencies"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:question"
  color: "d876e3"
  description: "Needs an answer, not code"
- name: "area:sync"
  color: "1d76db"
  description: "IMAP sync, folders, flags, offline cache"
- name: "area:compose"
  color: "1d76db"
  description: "Compose, send, outbox, drafts"
- name: "area:render"
  color: "1d76db"
  description: "Message display, HTML sanitizing, attachments"
- name: "area:auth"
  color: "1d76db"
  description: "Sign-in, provisioning, credentials"
- name: "area:search"
  color: "1d76db"
  description: "Search and indexing"
- name: "area:notifications"
  color: "1d76db"
  description: "New-mail notifications and push"
- name: "area:settings"
  color: "1d76db"
  description: "Settings, signatures, preferences"
- name: "area:install"
  color: "1d76db"
  description: "Installation, updates, packaging"
- name: "area:performance"
  color: "1d76db"
  description: "Speed, memory, battery, data use"
- name: "area:security"
  color: "b60205"
  description: "Security or privacy"
- name: "area:agent"
  color: "5319e7"
  description: "Agent setup: skills, hooks, rules, CLAUDE.md"
- name: "area:ci"
  color: "5319e7"
  description: "CI/CD and GitHub workflows"
- name: "platform:web"
  color: "c5def5"
  description: "Web client"
- name: "platform:windows"
  color: "c5def5"
  description: "Windows desktop"
- name: "platform:macos"
  color: "c5def5"
  description: "macOS desktop"
- name: "platform:linux"
  color: "c5def5"
  description: "Linux desktop"
- name: "platform:android"
  color: "c5def5"
  description: "Android"
- name: "platform:ios"
  color: "c5def5"
  description: "iPhone and iPad"
- name: "platform:backend"
  color: "c5def5"
  description: "Gateway, push relay, provisioning"
- name: "priority:p0"
  color: "b60205"
  description: "Data loss, security, or nobody can sign in/send"
- name: "priority:p1"
  color: "d93f0b"
  description: "Core flow broken for many users"
- name: "priority:p2"
  color: "fbca04"
  description: "Degraded or workaround exists"
- name: "priority:p3"
  color: "0e8a16"
  description: "Minor"
- name: "agent:ready"
  color: "5319e7"
  description: "Fully specified; an agent can run /implement on it"
- name: "needs-info"
  color: "fef2c0"
  description: "Waiting for details from the reporter"
- name: "triage:done"
  color: "ededed"
  description: "Triaged"
- name: "blocked"
  color: "b60205"
  description: "Waiting on another issue or decision"
- name: "epic"
  color: "3e4b9e"
  description: "Tracking issue for a spec"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported"
