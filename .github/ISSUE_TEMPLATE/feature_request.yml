name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why it's painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: platform
    attributes:
      label: Which devices matter most for this?
      multiple: true
      options: [Web, Windows, macOS, Linux, Android, iPhone / iPad, All]
  - type: textarea
    id: who
    attributes:
      label: Who benefits and how often?
      placeholder: e.g. the sales team, many times a day
